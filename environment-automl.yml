# Separate environment for the AutoML benchmark (step 2), see DECISIONS.md D-11 / D-28.
# AutoGluon needs pyarrow>=23, which conflicts with the pyarrow==20.0.0 pin in environment.yml.
# numpy, pandas, catboost and matplotlib are pinned to the same versions as the da-ml environment;
# scikit-learn is newer (see below).
name: da-ml-automl
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.2.2
      - scikit-learn==1.7.2   # not 1.4.0 like da-ml: its bundled msvcp140.dll breaks torch 2.13 on Windows (D-28)
      - catboost==1.2.8
      - matplotlib==3.8.2
      - autogluon.tabular[catboost,lightgbm,xgboost,fastai]==1.6.3
      - jupyter==1.0.0
